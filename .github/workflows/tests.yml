name: tests

on:
  push:
  pull_request:

jobs:
  # Full environment: the README's pinned install, so the frozen estimators
  # load and the committed reanalysis JSON is checked for exact reproduction.
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "qiskit==2.5.2" "qiskit-aer==0.17.2" "qiskit-ibm-runtime==0.50.0" \
                      "numpy==2.5.3" "scipy==1.18.1" pytest
      - name: Verify frozen script hash
        run: |
          test "$(sha256sum antimatter_analog_ibm.py | cut -d' ' -f1)" = \
               "$(grep antimatter_analog_ibm.py FROZEN-MANIFEST.txt | cut -d' ' -f1)"
      - name: Simulation selftest
        run: python antimatter_analog_ibm.py sim
      - name: Reanalysis tests
        run: python -m pytest -v reanalysis/

  # Minimal environment: numpy + scipy only, no qiskit. Guards the fallback path.
  numpy-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy + scipy only
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.5.3" "scipy==1.18.1" pytest
      - name: Reanalysis tests (frozen-estimator tests skip)
        run: python -m pytest -v -rs reanalysis/
      - name: Reanalysis CLI runs without qiskit
        run: python -I reanalysis/reanalyze_posthoc.py
